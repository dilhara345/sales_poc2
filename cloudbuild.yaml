steps:
  # Step 1: Run SQL to populate dim/fact tables via BigQuery CLI
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'run-sql-transforms'
    entrypoint: bash
    args:
      - -c
      - |
        bq query --use_legacy_sql=false < sql/dim_customer.sql
        bq query --use_legacy_sql=false < sql/dim_product.sql
        bq query --use_legacy_sql=false < sql/dim_order.sql
        bq query --use_legacy_sql=false < sql/fact_sales.sql

  # Step 2: Trigger the Data Fusion pipeline via its REST API
  # (fetches the correct API endpoint automatically instead of guessing it)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'trigger-data-fusion-pipeline'
    entrypoint: bash
    args:
      - -c
      - |
        ACCESS_TOKEN=$$(gcloud auth print-access-token)

        API_ENDPOINT=$$(gcloud data-fusion instances describe test-pipeline \
          --location=us-central1 \
          --format="value(apiEndpoint)")

        echo "Using API endpoint: $${API_ENDPOINT}"

        curl -X POST \
          -H "Authorization: Bearer $${ACCESS_TOKEN}" \
          -H "Content-Type: application/json" \
          "$${API_ENDPOINT}/v3/namespaces/default/apps/fact_sales_pipeline/workflows/DataPipelineWorkflow/start"

options:
  logging: CLOUD_LOGGING_ONLY